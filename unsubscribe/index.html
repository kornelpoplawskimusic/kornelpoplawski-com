  <h1>Unsubscribe</h1>

  <div id="unsub-ask">
    <p>Want to step off the list? No hard feelings. Confirm below and I'll remove your address.</p>
    <form class="list-form" id="unsub-form" action="https://api.web3forms.com/submit" method="POST">
      <input type="email" name="email" id="unsub-email" placeholder="your@email" required aria-label="Your email">
      <input type="hidden" name="access_key" value="9c1055d0-10a6-422b-9b59-b57c947f5029">
      <input type="hidden" name="subject" value="UNSUBSCRIBE: kornelpoplawski.com">
      <input type="hidden" name="from_name" value="kornelpoplawski.com mailing list">
      <input type="hidden" name="message" value="Please remove this address from the mailing list.">
      <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off">
      <button type="submit">Unsubscribe</button>
    </form>
  </div>

  <p id="unsub-done" style="display:none">Done. You won't get any more emails from this list. Thank you for having been on it.</p>

  <script>
  (function(){
    var f=document.getElementById('unsub-form'), e=document.getElementById('unsub-email');
    var m=location.search.match(/[?&]e=([^&]+)/);
    if(m){ try{ e.value=decodeURIComponent(m[1]); }catch(x){} }
    var b=f.querySelector('button'), label=b.textContent;
    f.addEventListener('submit',function(ev){
      ev.preventDefault(); b.disabled=true; b.textContent='...';
      fetch(f.action,{method:'POST',headers:{'Accept':'application/json'},body:new FormData(f)})
        .then(function(r){return r.json();})
        .then(function(d){
          if(d&&d.success){ document.getElementById('unsub-ask').style.display='none'; document.getElementById('unsub-done').style.display='block'; }
          else { throw new Error('fail'); }
        })
        .catch(function(){ b.disabled=false; b.textContent=label; alert('Something went wrong. Please reply to my email with "unsubscribe" instead.'); });
    });
  })();
  </script>
